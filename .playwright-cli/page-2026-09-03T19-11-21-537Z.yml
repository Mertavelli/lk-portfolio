            - heading "Project Inquiry" [level=2] [ref=e72]
            - paragraph [ref=e73]: I work with a small number of companies on AI strategy, workflow redesign, and the systems required to put those ideas into production.
            - paragraph [ref=e74]: The starting point is usually not a predefined tool. I first want to understand how your team works, where knowledge-intensive processes consume disproportionate time, and where AI can create meaningful leverage.
            - paragraph [ref=e75]: If there is a strong use case, I can support both the strategic design and the technical implementation.
            - paragraph [ref=e76]: If you think there may be a fit, tell me a little about your company and what you are currently looking to improve.
            - paragraph [ref=e77]: "Timing: I keep my workload intentionally focused and only take on a limited number of engagements at the same time. Timing depends on scope and current availability."
            - paragraph [ref=e78]: "Scope: I focus on AI-native operating models, agentic workflows, knowledge systems, and custom AI software. I am most useful where there is a meaningful business problem to solve rather than a predefined technical task."
