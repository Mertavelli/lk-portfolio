                - generic [ref=e201]:
                  - heading "Assess" [level=3] [ref=e202]
                  - paragraph [ref=e203]: Start with how the work happens today. Where does time go? Where does information move? Where do people stop to make a judgment?
                  - paragraph [ref=e204]: A useful map follows the work, not the org chart.
              - region [ref=e205]:
                - paragraph [ref=e206]: "02"
                - generic [ref=e207]:
                  - heading "Diagnose" [level=3] [ref=e208]
                  - paragraph [ref=e209]: Find the moments where AI can create real leverage. Separate repetitive synthesis from work that needs context, accountability, or expert judgment.
                  - paragraph [ref=e210]: Not every task should be automated.
              - region [ref=e211]:
                - paragraph [ref=e212]: "03"
                - generic [ref=e213]:
                  - heading "Prescribe" [level=3] [ref=e214]
                  - paragraph [ref=e215]: Define the target workflow before choosing tools. Set human and system responsibilities, the data required, the interfaces, the boundaries, and the order of work.
                  - paragraph [ref=e216]: A target workflow is more useful than a feature list.
              - region [ref=e217]:
                - paragraph [ref=e218]: "04"
                - generic [ref=e219]:
                  - heading "Implement" [level=3] [ref=e220]
                  - paragraph [ref=e221]: "Build what the workflow needs: retrieval, structured interfaces, integrations, review states, and software that can hold up in day-to-day use."
                  - paragraph [ref=e222]: Strategy only matters when it becomes a working system.
                  - link "See Markets AI" [ref=e223] [cursor=pointer]:
                    - /url: /#markets-ai
